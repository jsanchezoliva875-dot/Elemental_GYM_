  <title>Elemental Gym</title>
  <link rel="stylesheet" href="../css/styles.css">

  <script>
  // Función para el menú principal de tres líneas
  function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
  }

  // Función para desplegar el submenú de Rutinas (Hombres / Mujeres)
  function toggleSubmenu(event) {
    event.preventDefault();
    const submenu = event.currentTarget.nextElementSibling;
    submenu.classList.toggle("activo");
  }
</script>

<script>
  // Bloquear el zoom con la combinación Ctrl + Rueda del ratón en PC
  document.addEventListener('wheel', function(event) {
    if (event.ctrlKey) {
      event.preventDefault();
    }
  }, { passive: false });

  // Bloquear los gestos de pellizco para hacer zoom en pantallas táctiles
  document.addEventListener('gesturestart', function(event) {
    event.preventDefault();
  });

  document.addEventListener('gesturechange', function(event) {
    event.preventDefault();
  });

  document.addEventListener('gestureend', function(event) {
    event.preventDefault();
  });
  document.addEventListener('keydown', function(event) {
    if (event.ctrlKey && (event.key === '+' || event.key === '-' || event.key === '=' || event.key === '0')) {
      event.preventDefault();
    }
  });
</script>
