<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental Gym - Rutina de Espalda</title>
  <!-- Ajusta la cantidad de ../ según qué tan profunda esté tu carpeta ejercicios -->
  <link rel="stylesheet" href="../../css/ejercicios/ejercicios.css">
</head>
<body>

  <!-- Header principal -->
  <header>
    <div class="logo">
      <h2 class="logo-texto">ELEMENTAL <span class="linea-verde">GYM</span></h2>
    </div>
    <div class="menu-icon" id="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <!-- Banner contenedor principal -->
  <main class="banner">
    <div class="overlay"></div>

    <div class="auth-container ejercicios-container">
      
      <!-- Título principal del músculo -->
      <div class="header-form">
        <p class="subtitulo">RUTINA DE ENTRENAMIENTO</p>
        <h2 class="linea-blanca-sm">ESPALDA</h2>
      </div>

      <!-- Lista de ejercicios (3 apartados) -->
      <div class="ejercicios-grid">

        <!-- ================= EJERCICIO 1 ================= -->
        <div class="card-ejercicio">
          <h3 class="titulo-ejercicio">JALON AL PECHO</h3>
          
          <!-- AQUÍ METER TU IMAGEN 1 -->
          <!-- Cambia "ejercicio1.jpg" por el nombre real de tu primera imagen -->
          <img src="../../img/espalda/jalon.png" alt="jalon al pecho" class="img-ejercicio">
          
          <p class="detalles-series">4 Series x 10 - 12 Repeticiones</p>
        </div>

        <!-- ================= EJERCICIO 2 ================= -->
        <div class="card-ejercicio">
          <h3 class="titulo-ejercicio">REMO EN MAQUINA</h3>
          
          <!-- AQUÍ METER TU IMAGEN 2 -->
          <!-- Cambia "ejercicio2.jpg" por el nombre real de tu segunda imagen -->
          <img src="../../img/espalda/remo.png" alt="remo en maquina" class="img-ejercicio">
          
          <p class="detalles-series">4 Series x 12 Repeticiones</p>
        </div>

        <!-- ================= EJERCICIO 3 ================= -->
        <div class="card-ejercicio">
          <h3 class="titulo-ejercicio">REMO EN T</h3>
          
          <!-- AQUÍ METER TU IMAGEN 3 -->
          <!-- Cambia "ejercicio3.jpg" por el nombre real de tu tercera imagen -->
          <img src="../../img/espalda/remoT.png" alt="remo en t" class="img-ejercicio">
          
          <p class="detalles-series">3 Series x 15 Repeticiones</p>
        </div>

      </div>

      <!-- Botón para regresar -->
      <a href="../hombres.html" class="btn-volver">VOLVER A RUTINAS</a>

    </div>
  </main>

  <!-- Modal para ampliar la imagen -->
  <div id="modal-imagen" class="modal">
    <span class="cerrar-modal">&times;</span>
    <img class="modal-contenido" id="img-ampliada" alt="Ejercicio ampliado">
  </div>

  <!-- Modal HTML -->
  <div id="modal-imagen" class="modal">
    <span class="cerrar-modal">&times;</span>
    <img class="modal-contenido" id="img-ampliada" alt="Ejercicio ampliado">
  </div>

  <!-- Vinculación del script externo -->
  <script src="../../js/modal.js"></script>
</body>
</html>
</body>

</body>
</html>
