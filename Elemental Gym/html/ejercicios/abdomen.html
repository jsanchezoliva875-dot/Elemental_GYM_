<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental Gym - Rutina de Abdomen</title>
  
  <link rel="stylesheet" href="../../css/ejercicios/ejercicios.css">
</head>
<body>


  <header>
    <div class="logo">
      <h2 class="logo-texto">ELEMENTAL <span class="linea-verde">GYM</span></h2>
    </div>
    <div class="menu-icon" id="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  
  <main class="banner">
    <div class="overlay"></div>

    <div class="auth-container ejercicios-container">
      
      
      <div class="header-form">
        <p class="subtitulo">RUTINA DE ENTRENAMIENTO</p>
        <h2 class="linea-blanca-sm">ABDOMEN</h2>
      </div>

      <div class="ejercicios-grid">

       
        <div class="card-ejercicio">
          <h3 class="titulo-ejercicio">CRUNCH</h3>
          <img src="../../img/abdomen/crunch.png" alt="crunch" class="img-ejercicio">
          <p class="detalles-series">4 Series x 10 - 12 Repeticiones</p>
        </div>

       
        <div class="card-ejercicio">
          <h3 class="titulo-ejercicio">CRUNCH IBLICUO</h3>
          <img src="../../img/abdomen/crunchoblicuo.png" alt="crunch oblicuo" class="img-ejercicio">
          <p class="detalles-series">4 Series x 12 Repeticiones</p>
        </div>

       
        <div class="card-ejercicio">
          <h3 class="titulo-ejercicio">PLANCHA</h3>
          <img src="../../img/abdomen/plancha.png" alt="plancha" class="img-ejercicio">
          <p class="detalles-series">3 Series x 15 Repeticiones</p>
        </div>

      </div>

      <!-- Botón para regresar -->
      <a href="../hombres.html" class="btn-volver">VOLVER A RUTINAS</a>

    </div>
  </main>

  <!-- Modal para ampliar la imagen -->
  <div id="modal-imagen" class="modal">
    <span class="cerrar-modal">&times;</span>
    <img class="modal-contenido" id="img-ampliada" alt="Ejercicio ampliado">
  </div>

  <!-- Modal HTML -->
  <div id="modal-imagen" class="modal">
    <span class="cerrar-modal">&times;</span>
    <img class="modal-contenido" id="img-ampliada" alt="Ejercicio ampliado">
  </div>

  <!-- Vinculación del script externo -->
  <script src="../../js/modal.js"></script>
</body>
</html>
</body>

</body>
</html>
